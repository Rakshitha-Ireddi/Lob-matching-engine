<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LOB Console</title>
  <script src="vendor/tailwind.js"></script>
  <script src="vendor/react.js"></script>
  <script src="vendor/react-dom.js"></script>
  <script src="vendor/htm.js"></script>
  <style>
    :root{
      --glass-bg:rgba(255,255,255,0.04);
      --glass-bg-hover:rgba(255,255,255,0.07);
      --glass-border:rgba(255,255,255,0.10);
      --glass-border-strong:rgba(255,255,255,0.20);
      --buy:#3fb950; --sell:#f85149;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:#000;color:#fff;min-height:100vh;
      overflow-x:hidden;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
      -webkit-font-smoothing:antialiased}
    #root{max-width:100vw;overflow-x:hidden}
    ::-webkit-scrollbar{width:4px;height:4px}
    ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px}
    .bg-glow{background:radial-gradient(ellipse 90% 55% at 50% -10%,rgba(255,255,255,.07) 0%,transparent 60%),#000}
    .glass{background:var(--glass-bg);border:1px solid var(--glass-border);
      backdrop-filter:blur(12px);border-radius:16px;box-shadow:0 0 20px rgba(255,255,255,.04)}
    .glass-flat{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:12px}
    .tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
    .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.4)}
    .navlink{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;
      font-size:13px;color:rgba(255,255,255,.55);transition:all .15s ease;cursor:pointer;user-select:none}
    .navlink:hover{background:var(--glass-bg-hover);color:#fff}
    .navlink.active{background:rgba(255,255,255,.10);color:#fff;border:1px solid var(--glass-border-strong)}
    @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .fade{animation:fade .3s ease forwards}
    .depthbar{position:absolute;top:0;bottom:0;right:0;opacity:.16}
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const html = htm.bind(React.createElement);
    const { useState, useEffect, useRef } = React;

    const PARAMS = new URLSearchParams(location.search);
    const FIXED_VIEW = PARAMS.get("view");
    const TICK = 100;                       // price tick = $0.01, ticks -> dollars for display
    const fmtPx = t => t == null || t === 0 ? "--" : (t / TICK).toFixed(2);
    const fmtInt = n => (n ?? 0).toLocaleString("en-US");
    const fmtNs = ns => {
      if (ns == null) return "--";
      if (ns >= 1e9) return (ns/1e9).toFixed(2)+" s";
      if (ns >= 1e6) return (ns/1e6).toFixed(2)+" ms";
      if (ns >= 1e3) return (ns/1e3).toFixed(2)+" µs";
      return Math.round(ns)+" ns";
    };
    const fmtCompact = n => {
      if (n == null) return "--";
      if (n >= 1e6) return (n/1e6).toFixed(2)+"M";
      if (n >= 1e3) return (n/1e3).toFixed(1)+"k";
      return Math.round(n).toString();
    };

    function useSnapshot() {
      const [snap, setSnap] = useState(null);
      const [stale, setStale] = useState(false);
      const [err, setErr] = useState(null);
      useEffect(() => {
        let alive = true;
        const load = () => fetch("stats.json?" + Date.now())
          .then(r => r.ok ? r.json() : Promise.reject(r.status))
          .then(d => { if (!alive) return; setSnap(d); setErr(null);
            setStale(!!d.wall_unix_ms && (Date.now() - d.wall_unix_ms) > 15000); })
          .catch(e => { if (alive) setErr(String(e)); });
        load();
        const id = setInterval(load, 1000);
        return () => { alive = false; clearInterval(id); };
      }, []);
      return { snap, stale, err };
    }

    // ---------- primitives ----------
    const Stat = ({ label, value, sub, tone }) => html`
      <div class="glass p-5">
        <div class="lbl mb-2">${label}</div>
        <div class="text-3xl font-light tnum ${tone === "buy" ? "text-[var(--buy)]" : tone === "sell" ? "text-[var(--sell)]" : "text-white"}">${value}</div>
        ${sub && html`<div class="text-xs text-white/35 mt-1.5 tnum">${sub}</div>`}
      </div>`;

    const Card = ({ title, right, children, className = "" }) => html`
      <div class="glass ${className}">
        ${(title || right) && html`
          <div class="flex items-center justify-between px-5 pt-4 pb-3 border-b border-white/[0.06]">
            <h3 class="lbl">${title}</h3>${right || null}
          </div>`}
        <div class="p-5">${children}</div>
      </div>`;

    // ---------- depth ladder ----------
    function DepthLadder({ bids, asks, last }) {
      const maxQty = Math.max(1, ...bids.map(b => b.qty), ...asks.map(a => a.qty));
      const row = (lvl, side) => html`
        <div class="relative flex items-center justify-between px-3 py-1 text-[13px] tnum">
          <div class="depthbar ${side === "bid" ? "bg-[var(--buy)]" : "bg-[var(--sell)]"}"
               style=${{ width: (100 * lvl.qty / maxQty) + "%" }}></div>
          <span class="relative ${side === "bid" ? "text-[var(--buy)]" : "text-[var(--sell)]"}">${fmtPx(lvl.price)}</span>
          <span class="relative text-white/70">${fmtInt(lvl.qty)}</span>
          <span class="relative text-white/30 w-10 text-right">${lvl.orders}</span>
        </div>`;
      return html`
        <div>
          <div class="flex items-center justify-between px-3 pb-1 lbl">
            <span>Price</span><span>Size</span><span class="w-10 text-right">Ord</span>
          </div>
          <div>${asks.slice().reverse().map(a => row(a, "ask"))}</div>
          <div class="flex items-center justify-center gap-3 my-1.5 py-1 text-sm tnum
                      border-y border-white/[0.06] bg-white/[0.02]">
            <span class="text-white/40 text-xs uppercase tracking-wider">Last</span>
            <span class="font-medium">${fmtPx(last)}</span>
          </div>
          <div>${bids.map(b => row(b, "bid"))}</div>
        </div>`;
    }

    // ---------- latency histogram (inline svg) ----------
    function LatChart({ bins }) {
      if (!bins || !bins.length) return html`<div class="text-white/30 text-sm">no samples</div>`;
      const W = 620, H = 200, pad = 28;
      const maxC = Math.max(...bins.map(b => b.count));
      const xs = Math.log10(bins[0].lo || 1), xe = Math.log10(bins[bins.length - 1].hi || 1);
      const xAt = v => pad + (Math.log10(v) - xs) / (xe - xs) * (W - pad * 2);
      const bars = bins.map((b, i) => {
        const x0 = xAt(b.lo), x1 = xAt(b.hi + 1);
        const h = (b.count / maxC) * (H - pad * 2);
        return html`<rect key=${i} x=${x0 + 0.5} y=${H - pad - h} width=${Math.max(1, x1 - x0 - 1)}
          height=${h} fill="#4a90c4" opacity="0.85" />`;
      });
      const ticks = [100, 1000, 10000, 100000, 1000000];
      return html`
        <svg viewBox=${`0 0 ${W} ${H}`} preserveAspectRatio="xMidYMid meet"
             style=${{ display: "block", width: "100%", height: "auto" }}>
          <line x1=${pad} y1=${H - pad} x2=${W - pad} y2=${H - pad} stroke="rgba(255,255,255,.15)" />
          ${bars}
          ${ticks.filter(t => t >= (bins[0].lo || 1) && t <= bins[bins.length-1].hi).map(t => html`
            <g key=${t}>
              <line x1=${xAt(t)} y1=${pad} x2=${xAt(t)} y2=${H - pad} stroke="rgba(255,255,255,.06)" />
              <text x=${xAt(t)} y=${H - 8} fill="rgba(255,255,255,.35)" font-size="10" text-anchor="middle">${fmtNs(t)}</text>
            </g>`)}
        </svg>`;
    }

    // ---------- trade tape ----------
    const Tape = ({ tape }) => html`
      <div class="space-y-0.5 tnum text-[13px] max-h-[420px] overflow-y-auto">
        ${tape.slice().reverse().map((t, i) => html`
          <div key=${i} class="flex items-center justify-between px-3 py-1 rounded
               ${i === 0 ? "bg-white/[0.04]" : ""}">
            <span class=${t.aggressor === "buy" ? "text-[var(--buy)]" : "text-[var(--sell)]"}>
              ${t.aggressor === "buy" ? "▲" : "▼"} ${fmtPx(t.price)}
            </span>
            <span class="text-white/60">${fmtInt(t.qty)}</span>
            <span class="text-white/25 text-xs">${t.aggressor.toUpperCase()}</span>
          </div>`)}
      </div>`;

    // ---------- views ----------
    function Overview({ s }) {
      const L = s.latency || {};
      return html`
        <div class="space-y-5 fade min-w-0">
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <${Stat} label="Throughput" value=${fmtCompact(s.throughput_ops) + "/s"} sub=${fmtInt(s.commands_total) + " commands"} />
            <${Stat} label="Engine p50" value=${fmtNs(L.p50)} sub=${"p99 " + fmtNs(L.p99)} />
            <${Stat} label="Trades" value=${fmtCompact(s.trades_total)} sub=${fmtCompact(s.shares_total) + " shares"} />
            <${Stat} label="Resting Orders" value=${fmtInt(s.resting_orders)} sub=${"rejects " + fmtCompact(s.rejects_total)} />
          </div>
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
            <${Card} title="Top of Book" className="lg:col-span-1">
              <div class="grid grid-cols-2 gap-4 tnum">
                <div><div class="lbl mb-1">Bid</div><div class="text-2xl font-light text-[var(--buy)]">${fmtPx(s.best_bid)}</div>
                  <div class="text-xs text-white/35 mt-1">${fmtInt((s.bids[0]||{}).qty)} size</div></div>
                <div><div class="lbl mb-1">Ask</div><div class="text-2xl font-light text-[var(--sell)]">${fmtPx(s.best_ask)}</div>
                  <div class="text-xs text-white/35 mt-1">${fmtInt((s.asks[0]||{}).qty)} size</div></div>
              </div>
              <div class="mt-4 pt-4 border-t border-white/[0.06] flex justify-between text-sm tnum">
                <span class="text-white/40">Spread</span><span>${s.spread + (s.spread === 1 ? " tick" : " ticks")} · $${(s.spread/TICK).toFixed(2)}</span>
              </div>
              <div class="mt-2 flex justify-between text-sm tnum">
                <span class="text-white/40">Market data</span><span>${fmtCompact(s.md_msgs_per_s)}/s · ${(s.md_mbit_per_s||0).toFixed(1)} Mbit/s</span>
              </div>
            </${Card}>
            <${Card} title="Engine Latency Distribution" className="lg:col-span-2">
              <div class="w-full overflow-hidden"><${LatChart} bins=${L.histogram} /></div>
              <div class="grid grid-cols-5 gap-1 sm:gap-2 mt-3 text-center tnum">
                ${["p50","p90","p99","p999","max"].map(k => html`
                  <div key=${k}><div class="lbl">${k === "p999" ? "p99.9" : k}</div>
                    <div class="text-[12px] sm:text-sm mt-1">${fmtNs(L[k])}</div></div>`)}
              </div>
            </${Card}>
          </div>
          <${Card} title="Recent Trades">
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-x-6 gap-y-1 tnum text-[13px]">
              ${(s.tape||[]).slice().reverse().slice(0,15).map((t,i)=>html`
                <div key=${i} class="flex justify-between">
                  <span class=${t.aggressor==="buy"?"text-[var(--buy)]":"text-[var(--sell)]"}>${fmtPx(t.price)}</span>
                  <span class="text-white/50">${fmtInt(t.qty)}</span>
                </div>`)}
            </div>
          </${Card}>
        </div>`;
    }

    function BookView({ s }) {
      return html`
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-5 fade min-w-0">
          <${Card} title=${s.instrument + "  ·  Depth"} className="lg:col-span-2"
            right=${html`<span class="text-xs text-white/40 tnum">mid ${fmtPx((s.best_bid+s.best_ask)/2)}</span>`}>
            <${DepthLadder} bids=${s.bids} asks=${s.asks} last=${s.last_px} />
          </${Card}>
          <div class="space-y-5">
            <div class="grid grid-cols-2 gap-4">
              <${Stat} label="Spread" value=${s.spread} sub="ticks" />
              <${Stat} label="Resting" value=${fmtCompact(s.resting_orders)} sub="orders" />
            </div>
            <${Card} title="Trade Tape"><${Tape} tape=${s.tape||[]} /></${Card}>
          </div>
        </div>`;
    }

    function LatencyView({ s }) {
      const L = s.latency || {};
      const rows = [["min",L.min],["p50",L.p50],["p90",L.p90],["p99",L.p99],["p99.9",L.p999],["max",L.max],["mean",L.mean]];
      return html`
        <div class="space-y-5 fade min-w-0">
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <${Stat} label="Median" value=${fmtNs(L.p50)} />
            <${Stat} label="p99" value=${fmtNs(L.p99)} />
            <${Stat} label="p99.9" value=${fmtNs(L.p999)} />
            <${Stat} label="Samples" value=${fmtCompact(L.count)} />
          </div>
          <${Card} title="Latency Histogram" right=${html`<span class="text-xs text-white/35">${L.scope} · command → events</span>`}>
            <${LatChart} bins=${L.histogram} />
          </${Card}>
          <${Card} title="Percentiles">
            <table class="w-full text-sm tnum">
              <tbody>
                ${rows.map(([k,v]) => html`
                  <tr key=${k} class="border-b border-white/[0.05] last:border-0">
                    <td class="py-2.5 text-white/45 uppercase text-xs tracking-wider">${k}</td>
                    <td class="py-2.5 text-right">${fmtNs(v)}</td>
                  </tr>`)}
              </tbody>
            </table>
          </${Card}>
        </div>`;
    }

    function FeedView({ s }) {
      return html`
        <div class="space-y-5 fade min-w-0">
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <${Stat} label="MD Messages" value=${fmtCompact(s.md_msgs_per_s) + "/s"} />
            <${Stat} label="Bandwidth" value=${(s.md_mbit_per_s||0).toFixed(2)} sub="Mbit/s" />
            <${Stat} label="Sequence Gaps" value=${fmtInt(s.md_seq_gaps)} tone=${s.md_seq_gaps ? "sell" : null} />
            <${Stat} label="Trades Published" value=${fmtCompact(s.trades_total)} />
          </div>
          <${Card} title="Market-Data Feed">
            <div class="text-sm text-white/60 leading-relaxed space-y-2">
              <p>${"Binary UDP multicast, 8-byte header + fixed-size body, little-endian. One "}
                 <span class="text-white/85">MdTrade</span>${" per match and one "}
                 <span class="text-white/85">MdBookChange</span>${" per top-of-book move, plus 2 Hz heartbeats."}</p>
              <p>${"The subscriber tracks the per-stream sequence number; a jump flags dropped datagrams (" + fmtInt(s.md_seq_gaps) + " on this run)."}</p>
            </div>
          </${Card}>
          <${Card} title="Latest Prints"><${Tape} tape=${s.tape||[]} /></${Card}>
        </div>`;
    }

    // ---------- shell ----------
    const NAV = [
      ["overview", "Overview"],
      ["book", "Order Book"],
      ["latency", "Latency"],
      ["feed", "Market Data"],
    ];

    function App() {
      const { snap, stale, err } = useSnapshot();
      const [view, setView] = useState(FIXED_VIEW || "overview");
      const [now, setNow] = useState(Date.now());
      useEffect(() => { const id = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(id); }, []);

      const s = snap;
      const connected = s && !stale && !err;

      return html`
        <div class="min-h-screen bg-glow flex overflow-x-hidden">
          <aside class="w-56 shrink-0 border-r border-white/[0.06] p-4 hidden md:flex flex-col">
            <div class="flex items-center gap-2.5 px-2 py-3 mb-4">
              <div class="w-7 h-7 rounded-lg bg-white text-black grid place-items-center font-bold text-sm">L</div>
              <div><div class="text-sm font-semibold leading-tight">LOB Console</div>
                <div class="text-[10px] text-white/35 uppercase tracking-wider">Matching Engine</div></div>
            </div>
            <nav class="space-y-1">
              ${NAV.map(([k, label]) => html`
                <div key=${k} class=${"navlink " + (view === k ? "active" : "")}
                     onClick=${() => setView(k)}>
                  <span class="w-1.5 h-1.5 rounded-full ${view === k ? "bg-white" : "bg-white/25"}"></span>${label}
                </div>`)}
            </nav>
            <div class="mt-auto glass-flat p-3 text-[11px] text-white/40 leading-relaxed">
              <div class="flex items-center gap-1.5 mb-1">
                <span class="w-1.5 h-1.5 rounded-full ${connected ? "bg-[var(--buy)]" : "bg-[var(--sell)]"}"></span>
                <span class="text-white/60">${connected ? "Live" : stale ? "Stale feed" : "Disconnected"}</span>
              </div>
              ${s && html`<div class="tnum">uptime ${Math.floor(s.uptime_s/60)}m ${Math.round(s.uptime_s%60)}s</div>`}
            </div>
          </aside>

          <div class="flex-1 min-w-0 flex flex-col">
            <header class="flex items-center justify-between gap-2 px-4 sm:px-6 h-14 border-b border-white/[0.06]">
              <div class="flex items-center gap-2.5 min-w-0">
                <span class="font-medium shrink-0">${s ? s.instrument : "LOB-PERP"}</span>
                ${s && html`<span class="tnum text-sm text-white/50 truncate">
                  <span class="text-[var(--buy)]">${fmtPx(s.best_bid)}</span>
                  <span class="text-white/25"> / </span>
                  <span class="text-[var(--sell)]">${fmtPx(s.best_ask)}</span></span>`}
              </div>
              <div class="flex items-center gap-3 text-xs text-white/40 tnum shrink-0">
                <span class="hidden sm:inline">${new Date(now).toLocaleTimeString("en-GB")}</span>
                <span class="flex items-center gap-1.5">
                  <span class="w-1.5 h-1.5 rounded-full ${connected ? "bg-[var(--buy)]" : "bg-[var(--sell)]"}"></span>
                  <span class="hidden sm:inline">${connected ? "streaming" : "offline"}</span>
                </span>
              </div>
            </header>

            <main class="flex-1 min-w-0 p-4 sm:p-6 overflow-y-auto overflow-x-hidden">
              ${!s && html`<div class="text-white/40 text-sm">Waiting for engine snapshot (stats.json)…</div>`}
              ${s && view === "overview" && html`<${Overview} s=${s} />`}
              ${s && view === "book" && html`<${BookView} s=${s} />`}
              ${s && view === "latency" && html`<${LatencyView} s=${s} />`}
              ${s && view === "feed" && html`<${FeedView} s=${s} />`}
            </main>
          </div>
        </div>`;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
  </script>
</body>
</html>
